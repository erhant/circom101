name: book

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on: workflow_dispatch

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install mdbook
        uses: extractions/setup-crate@v1
        with:
          owner: rust-lang
          name: mdBook
          version: "0.5.4"

      - name: Install KaTeX preprocessor
        uses: extractions/setup-crate@v1
        with:
          owner: lzanini
          name: mdbook-katex
          version: "0.10.0-alpha-binaries" # the release tag that has the binaries

      - name: Install Mermaid preprocessor
        uses: extractions/setup-crate@v1
        with:
          owner: badboy
          name: mdbook-mermaid
          version: "0.17.0"

      - name: Setup Node.js (required to install Vercel CLI)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate static content for the book
        run: npm run book:build

      - name: Install Vercel CLI
        run: npm install --global vercel@65.12.1

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel ./book/book --prod --token=${{ secrets.VERCEL_TOKEN }}
